name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + selftest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Selftest (30 logic checks)
        run: .build/debug/Explorerr --selftest

      - name: Bundle app
        run: ./scripts/make-app.sh release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Explorerr-app
          path: build/Explorerr.app
