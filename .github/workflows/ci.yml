name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + selftest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Selftest
        run: .build/debug/Explorerr --selftest

      - name: Build DMG
        id: dmg
        run: |
          VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          ./scripts/make-dmg.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          hdiutil verify "build/Explorerr-$VERSION.dmg"

      - name: Upload app artifact
        uses: actions/upload-artifact@v5
        with:
          name: Explorerr-app
          path: build/Explorerr.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: Explorerr-dmg
          path: build/Explorerr-${{ steps.dmg.outputs.version }}.dmg
